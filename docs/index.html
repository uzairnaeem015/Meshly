  <body class="bg-[#0B1114] text-[#F1F5F6] antialiased selection:bg-[#00B37E]/30 selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        var booted = false;
        function loadPrecompiledBundle() {
          if (booted || window.__MESHLY_MOUNTED__) return;
          booted = true;
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './docs/assets/meshly.css';
          document.head.appendChild(css);
          var js = document.createElement('script');
          js.type = 'module';
          js.src = './docs/assets/meshly.js';
          document.body.appendChild(js);
        }
        var isViteDev = Boolean(document.querySelector('script[src*="@vite/client"]'));
        var rawTsxScript = document.querySelector('script[src*="src/main.tsx"]');
        if (!isViteDev && rawTsxScript) {
          rawTsxScript.addEventListener('error', loadPrecompiledBundle);
          if (/github\.io$/i.test(window.location.hostname)) {
            loadPrecompiledBundle();
          } else {
            window.setTimeout(loadPrecompiledBundle, 900);
          }
        }
      })();
    </script>
  </body>
